    <script>
        function copiarDiscord() {
            const discordTag = "quarksw";
            const btnDiscord = document.getElementById("btn-discord");
            const rotulo = btnDiscord.querySelector(".rotulo");

            const mostrarCopiado = () => {
                btnDiscord.classList.add("copiado");
                rotulo.textContent = "Copiado!";

                clearTimeout(btnDiscord.tempoCopiado);
                btnDiscord.tempoCopiado = setTimeout(() => {
                    btnDiscord.classList.remove("copiado");
                    rotulo.textContent = "Discord";
                }, 1400);
            };

            const copiarSemApi = () => {
                const campo = document.createElement("textarea");
                campo.value = discordTag;
                campo.setAttribute("readonly", "");
                campo.style.position = "fixed";
                campo.style.top = "-1000px";
                campo.style.opacity = "0";
                document.body.appendChild(campo);
                campo.select();

                try {
                    document.execCommand("copy");
                    mostrarCopiado();
                } catch (erro) {
                    console.error('Não foi possível copiar o Discord: ', erro);
                } finally {
                    document.body.removeChild(campo);
                }
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(discordTag)
                    .then(mostrarCopiado)
                    .catch(copiarSemApi);
            } else {
                copiarSemApi();
            }
        }
    </script>
